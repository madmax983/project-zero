[package]
name = "scale"
version = "0.1.0"
edition = "2024"

[features]
nova = []
default = ["native"]
native = ["dep:crossterm", "ratatui/crossterm", "dep:comfy-table"]
wasm = ["dep:ratzilla", "dep:getrandom"]

[dependencies]
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
bevy_tasks = "0.15"
ratatui = { version = "0.30", default-features = false, features = ["std", "all-widgets", "macros", "underline-color"] }
crossterm = { version = "0.29", optional = true }
comfy-table = { version = "7.1", optional = true }
ratzilla = { version = "0.3", optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
anyhow = "1.0"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
similar_names = "allow"
needless_pass_by_value = "allow" # Bevy system params must be passed by value

[[bin]]
name = "scale"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "wasm_app"
path = "src/bin/wasm_app.rs"
required-features = ["wasm"]

[[bin]]
name = "headless"
path = "src/bin/headless.rs"
required-features = ["native"]

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "utility_ai_bench"
harness = false
