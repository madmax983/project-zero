[package]
name = "scale"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15.1", default-features = false, features = ["multi_threaded"] }
bevy_ecs = "0.15.1"
bevy_app = "0.15.1"
bevy_utils = "0.15.1"
bevy_reflect = "0.15.1"
bevy_time = "0.15.1"
bevy_tasks = "0.15.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
rand = "0.8.5"
ratatui = "0.29.0"
crossterm = "0.28.1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
rand_distr = "0.4.3"
noise = "0.9.0"
petgraph = "0.6.5"
comfy-table = "7.1.3"
image = "0.25.5"
wgpu = "23.0.0"
pollster = "0.3.0"
bytemuck = { version = "1.19.0", features = ["derive"] }
strum = "0.26"
strum_macros = "0.26"

[dev-dependencies]
mockall = "0.13.1"
assert_approx_eq = "1.1.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
strip = true

[features]
default = []
nova = [] # Feature flag for Nova (Expansion 1) content
