services:
  - type: web
    name: scale
    runtime: static
    buildCommand: |
      rustup target add wasm32-unknown-unknown &&
      cargo install --locked trunk &&
      trunk build --release
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - src/**
        - web/**
        - Cargo.toml
        - Trunk.toml
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
