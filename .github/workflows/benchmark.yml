name: Benchmarks

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-20.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-criterion
        run: cargo install cargo-criterion || true

      - name: Run benchmarks
        run: |
          if [ -d "benches" ]; then
            cargo criterion --message-format=json > benchmark-results.json || echo "No benchmarks configured yet"
          else
            echo "No benchmarks directory found - skipping"
          fi
