name: Jules PR Auto-Review

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    auto-review:
        # Only run for PRs opened by Mark
        if: github.actor == 'madmax983'
        runs-on: ubuntu-20.04
        permissions:
            contents: write
            pull-requests: write
            checks: read
            id-token: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Review and Auto-Merge Jules PR
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN  }}
                  claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh pr merge:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
                  prompt: |
                      Merge this PR using: `gh pr merge ${{ github.event.pull_request.number }} --squash --auto`

                      **Context:**
                      - Repository: skunkworks (creative experiments, low-stakes)
